server:
  port: ${PORTA:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      tracking-modes: cookie
      cookie:
        same-site: lax   # o cookie do login só vai em pedidos feitos pelo próprio site

spring:
  # Usuário e senha do MySQL ficam no arquivo mysql.properties (na pasta do projeto)
  config:
    import: optional:file:./mysql.properties
  datasource:
    # createDatabaseIfNotExist: cria o banco clinica_estetica se ele ainda não existir
    url: jdbc:mysql://${mysql.host:localhost}:${mysql.porta:3306}/clinica_estetica?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
    username: ${mysql.usuario:root}
    password: ${mysql.senha:root}

# Dados da clínica exibidos no site (altere aqui)
clinica:
  nome: Clínica Bella Estética
  descricao: >-
    Cuidamos da sua beleza e do seu bem-estar com tratamentos faciais,
    corporais e capilares realizados por profissionais especializados.
  whatsapp: "5500000000000"   # DDI + DDD + número, só dígitos
  endereco: Av. Paulista, 1000 – Bela Vista
  cidade: São Paulo – SP, 01310-100
  mapa-busca: Avenida Paulista, 1000, São Paulo
